<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Quiz Arena | Login</title>

    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
     <div class="container">

        <div class="left-section">
            <div class="logo">🎓 Campus Quiz Arena</div>

            <div class="welcome-text">
                <h1>Learn More.<br>Challenge Yourself.</h1>

                <p>
                    Test your knowledge, improve your skills,
                    and compete with your friends.
                </p>
            </div>

            <div class="bottom-text">
                Learn • Practice • Improve
            </div>
        </div>

        <div class="right-section">

            <div class="login-box">

                <h2 id="formTitle">Welcome Back!</h2>

                <p class="subtitle" id="formSubtitle">
                    Login to continue your learning journey.
                </p>

                <form id="authForm">

                    <div class="input-group" id="nameGroup" hidden>
                        <label for="name">Full Name</label>
                        <input
                            type="text"
                            id="name"
                            placeholder="Enter your name"
                        >
                    </div>

                    <div class="input-group">
                        <label for="email">Email Address</label>
                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >
                    </div>

                    <button type="submit" id="submitBtn">
                        Login
                    </button>

                </form>

                <p class="switch-text">
                    <span id="switchMessage">Don't have an account?</span>
                    <a href="#" id="switchMode">Create Account</a>
                </p>

                <p id="message"></p>

            </div>

        </div>

    </div>

    <script src="../js/login.js"></script>
</body>
</html>
